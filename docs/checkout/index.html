<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Subscribe to Snag Pro</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0f;
    color: #e2e8f0;
  }
  .card {
    max-width: 360px;
    width: 100%;
    padding: 32px 28px;
    text-align: center;
  }
  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 16px;
    border: 3px solid rgba(99,102,241,0.25);
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 16px; margin: 0 0 6px; color: #f1f5f9; }
  p { font-size: 13px; color: #94a3b8; line-height: 1.5; margin: 0; }
  .error {
    display: none;
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.2);
    color: #f87171;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Opening checkout&hellip;</h1>
    <p>If nothing appears in a moment, your browser may have blocked a popup &mdash; allow popups for this page and reload.</p>
    <div class="error" id="error"></div>
  </div>

  <!-- Paddle Billing JS v2 (sandbox — switch to production before going live) -->
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script>
    // ---- Fixed per-deployment config ----
    var PADDLE_ENVIRONMENT = "sandbox"; // change to omit/"production" when going live
    var PADDLE_CLIENT_TOKEN = "test_838e07ea6611e06d99d8e5dbffe"; // public client-side token — safe to expose
    var PRICE_ID = "pri_01m2ak6c2wxghst5vrhqrpa3d4"; // Snag Pro, $5/month
    var SUCCESS_URL = new URL("success.html", window.location.href).toString();

    function showError(msg) {
      var el = document.getElementById("error");
      el.textContent = msg;
      el.style.display = "block";
    }

    // The extension appends ?custom_data[cognitoSub]=<sub> (see
    // extension/src/shared/pricing.ts buildCheckoutUrl) so the webhook can
    // link the resulting subscription back to the signed-in Cognito user.
    function getCognitoSub() {
      var params = new URLSearchParams(window.location.search);
      return params.get("custom_data[cognitoSub]") || "";
    }

    var cognitoSub = getCognitoSub();
    if (!cognitoSub) {
      showError("Missing account reference — open this page from the Snag sidebar's Subscribe button, not directly.");
    } else {
      try {
        Paddle.Environment.set(PADDLE_ENVIRONMENT);
        Paddle.Initialize({ token: PADDLE_CLIENT_TOKEN });
        Paddle.Checkout.open({
          items: [{ priceId: PRICE_ID, quantity: 1 }],
          customData: { cognitoSub: cognitoSub },
          settings: { successUrl: SUCCESS_URL },
        });
      } catch (e) {
        showError("Couldn't open checkout: " + (e && e.message ? e.message : e));
      }
    }
  </script>
</body>
</html>
