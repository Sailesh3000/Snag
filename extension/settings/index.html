<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snag Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 560px;
      width: 100%;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .logo {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(99,102,241,0.3);
    }
    .logo svg { width: 20px; height: 20px; color: white; }
    h1 { font-size: 20px; font-weight: 700; color: #f1f5f9; }
    .subtitle { font-size: 12px; color: #64748b; margin-top: 2px; }

    .section {
      background: #111118;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 10px 14px;
      background: #1a1a24;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    input::placeholder { color: #4a5568; }
    select { cursor: pointer; }
    select option { background: #1a1a24; color: #e2e8f0; }

    .hint {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }
    .hint a {
      color: #6366f1;
      text-decoration: none;
    }
    .hint a:hover { text-decoration: underline; }

    .btn {
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      box-shadow: 0 2px 12px rgba(99,102,241,0.3);
    }
    .btn-primary:hover {
      box-shadow: 0 4px 20px rgba(99,102,241,0.4);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #94a3b8;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
      color: #e2e8f0;
    }
    .actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 24px;
    }
    .status {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      margin-top: 8px;
      display: none;
    }
    .status.show { display: block; }
    .status.success {
      background: rgba(16,185,129,0.1);
      color: #10b981;
      border: 1px solid rgba(16,185,129,0.2);
    }
    .status.error {
      background: rgba(239,68,68,0.1);
      color: #ef4444;
      border: 1px solid rgba(239,68,68,0.2);
    }
    .key-input-wrap {
      position: relative;
    }
    .key-input-wrap input {
      padding-right: 40px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
    }
    .toggle-visibility {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px;
    }
    .toggle-visibility:hover { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="header">
      <div class="logo">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <div>
        <h1>Snag Settings</h1>
        <div class="subtitle">Configure your AI provider and API keys</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">LLM Provider</div>
      <div class="field">
        <label for="provider">Provider</label>
        <select id="provider">
          <option value="ollama">Ollama (Local, Free)</option>
          <option value="openai">OpenAI (GPT-4o-mini)</option>
          <option value="anthropic">Anthropic (Claude Haiku)</option>
          <option value="groq">Groq (Free Tier)</option>
          <option value="openai-compatible">OpenAI-Compatible API</option>
        </select>
      </div>

      <div class="field" id="apiKeyField" style="display:none">
        <label for="apiKey">API Key</label>
        <div class="key-input-wrap">
          <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" />
          <button class="toggle-visibility" id="toggleVis">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
        <div class="hint" id="apiKeyHint"></div>
      </div>

      <div class="field" id="baseUrlField" style="display:none">
        <label for="baseUrl">Base URL</label>
        <input type="text" id="baseUrl" placeholder="https://api.openai.com/v1" />
        <div class="hint">For OpenAI-compatible APIs (e.g., LM Studio, Together AI, custom endpoints)</div>
      </div>

      <div class="field" id="modelField" style="display:none">
        <label for="model">Model ID</label>
        <input type="text" id="model" placeholder="gpt-4o-mini" />
        <div class="hint" id="modelHint">Leave blank to use the provider's default model</div>
      </div>

      <div class="field" id="ollamaUrlField">
        <label for="ollamaUrl">Ollama URL</label>
        <input type="text" id="ollamaUrl" placeholder="http://127.0.0.1:11434" />
      </div>

      <div class="field" id="ollamaModelField">
        <label for="ollamaModel">Ollama Model</label>
        <input type="text" id="ollamaModel" placeholder="qwen3:8b" />
      </div>

      <div class="field">
        <label for="backendUrl">Backend Server URL</label>
        <input type="text" id="backendUrl" placeholder="ws://127.0.0.1:8765" />
        <div class="hint">WebSocket URL for the backend server. For local: <code>ws://127.0.0.1:8765</code></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Profile Defaults</div>
      <div class="field">
        <label for="defaultCompany">Default Company</label>
        <input type="text" id="defaultCompany" placeholder="e.g., Google" />
      </div>
      <div class="field">
        <label for="defaultRole">Default Role</label>
        <input type="text" id="defaultRole" placeholder="e.g., Software Engineer" />
      </div>
    </div>

    <div id="status" class="status"></div>

    <div class="actions">
      <button class="btn btn-secondary" id="resetBtn">Reset Defaults</button>
      <button class="btn btn-primary" id="saveBtn">Save Settings</button>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
