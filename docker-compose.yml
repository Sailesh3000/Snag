services:
  backend:
    build: .
    ports:
      # Bind the HOST side to loopback only — "8765:8765" would publish on
      # every host interface (LAN-reachable), undoing the point of the
      # backend's own 127.0.0.1 default. SNAG_HOST must stay 0.0.0.0 inside
      # the container (that's the container's own private network
      # namespace, not the host's) or Docker can't forward to it at all.
      - "127.0.0.1:8765:8765"
    environment:
      - SNAG_HOST=0.0.0.0
      - SNAG_PORT=8765
      - SNAG_LOG_LEVEL=INFO
      - SNAG_CORS_ORIGINS=["*"]
      - SNAG_OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

volumes:
  backend-data:
