version: "3.8"

services:
  backend:
    build: .
    ports:
      - "8765:8765"
    environment:
      - SNAG_HOST=0.0.0.0
      - SNAG_PORT=8765
      - SNAG_LOG_LEVEL=INFO
      - SNAG_CORS_ORIGINS=["*"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

volumes:
  backend-data:
