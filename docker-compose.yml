version: "3.8"

services:
  backend:
    build: .
    ports:
      - "8765:8765"
    environment:
      - APPLYPILOT_HOST=0.0.0.0
      - APPLYPILOT_PORT=8765
      - APPLYPILOT_LOG_LEVEL=INFO
      - APPLYPILOT_CORS_ORIGINS=["*"]
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

volumes:
  backend-data:
