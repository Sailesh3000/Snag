app = "snag-backend"
primary_region = "iad"

[build]

[env]
  SNAG_HOST = "0.0.0.0"
  SNAG_PORT = "8765"
  SNAG_LOG_LEVEL = "INFO"
  SNAG_CORS_ORIGINS = "[\"*\"]"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "snag_data"
  destination = "/app/data"
